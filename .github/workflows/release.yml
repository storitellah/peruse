name: Release desktop installers

# Builds the macOS .dmg and Windows .exe (NSIS) installers and attaches them to
# a GitHub Release. Trigger by pushing a version tag (e.g. `v0.1.0`) or running
# the workflow manually. Each installer is built on its native OS runner —
# there's no cross-compilation — so the artifacts are genuine platform builds.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            rust-targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icons

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', github.run_number, github.sha) }}
          releaseName: "Peruse ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}"
          releaseBody: "Local-first, privacy-focused photo cataloging. Download the installer for your platform below. Builds are unsigned — on macOS, right-click the app and choose Open the first time; on Windows, accept the SmartScreen prompt."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
