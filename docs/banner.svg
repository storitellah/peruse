<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peruse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#0057d8"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe4ff"/>
    </linearGradient>
    <style>
      .wm { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- faint photo-grid motif, right side -->
  <g opacity="0.06" fill="#ffffff">
    <rect x="760" y="70" width="90" height="120" rx="10"/>
    <rect x="862" y="70" width="150" height="120" rx="10"/>
    <rect x="1024" y="70" width="116" height="120" rx="10"/>
    <rect x="760" y="202" width="130" height="88" rx="10"/>
    <rect x="902" y="202" width="100" height="88" rx="10"/>
    <rect x="1014" y="202" width="126" height="88" rx="10"/>
  </g>

  <!-- aperture mark -->
  <g transform="translate(150 180)">
    <rect x="-84" y="-84" width="168" height="168" rx="40" fill="url(#lens)"/>
    <g transform="scale(0.5)" fill="url(#blade)" opacity="0.97">
      <g id="ap"><path d="M0 -150 A150 150 0 0 1 129.9 -75 L44 -25.4 A50 50 0 0 0 0 -50 Z"/></g>
      <use href="#ap" transform="rotate(60)"/>
      <use href="#ap" transform="rotate(120)"/>
      <use href="#ap" transform="rotate(180)"/>
      <use href="#ap" transform="rotate(240)"/>
      <use href="#ap" transform="rotate(300)"/>
    </g>
    <circle cx="-20" cy="-20" r="12" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text class="wm" x="270" y="168" font-size="76" font-weight="700" letter-spacing="-2" fill="#f5f5f7">Peruse</text>
  <text class="wm" x="272" y="212" font-size="23" font-weight="500" fill="#a8a8b3">Organize, catalog &amp; archive your photos — entirely on-device.</text>
  <g transform="translate(273 240)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text class="wm" x="16" y="20" font-size="13" font-weight="600" fill="#e6e6ea">🔒 No cloud · no uploads</text>
    <rect x="164" y="0" width="132" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text class="wm" x="180" y="20" font-size="13" font-weight="600" fill="#e6e6ea">🧠 On-device AI</text>
  </g>
</svg>
