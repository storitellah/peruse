<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peruse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#0057d8"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeaff"/>
    </linearGradient>
  </defs>

  <!-- Squircle-ish app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Camera aperture: six blades around a hexagonal opening.
       Reads as a lens — "peruse", to look closely. -->
  <g transform="translate(256 256)" fill="url(#blade)" opacity="0.96">
    <g id="ap">
      <path d="M0 -150 A150 150 0 0 1 129.9 -75 L44 -25.4 A50 50 0 0 0 0 -50 Z"/>
    </g>
    <use href="#ap" transform="rotate(60)"/>
    <use href="#ap" transform="rotate(120)"/>
    <use href="#ap" transform="rotate(180)"/>
    <use href="#ap" transform="rotate(240)"/>
    <use href="#ap" transform="rotate(300)"/>
  </g>

  <!-- Catch-light highlight -->
  <circle cx="205" cy="205" r="26" fill="#ffffff" opacity="0.9"/>
</svg>
